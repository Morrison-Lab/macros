# Build half of the PR-preview family, delegated to the reusable workflow in
# Morrison-Lab/gha. Runs read-only in the (possibly fork) PR context and uploads
# the rendered site as an artifact; preview-deploy.yml publishes it to gh-pages.
name: Quarto Preview Build

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/preview.yml@v2
    with:
      use-renv: false
      install-package: false
      setup-chrome: false
      submodules: 'false'
      apt-packages: ''
      formats: 'default'
      r-packages: |
        any::knitr
        any::rmarkdown
        any::DT
      tinytex: true
