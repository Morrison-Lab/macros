project:
  type: website
  resources:
    - macros.qmd

filters:
  - d-morrison/code-language-labels

website:
  title: "macros"
  repo-url: https://github.com/d-morrison/macros
  repo-actions: [source]
  page-footer:
    center: "Built with [Quarto](https://quarto.org/)"
  back-to-top-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: macros-table.qmd
        text: Macro Reference
      - href: notation-choices.qmd
        text: Notation Choices
      - href: notation-across-sources.qmd
        text: Notation Across Sources
      - href: demo-include-in-header.qmd
        text: Demo (include in header strategy)
      - href: demo-shortcode.qmd
        text: Demo (include shortcode strategy)
    right:
      - icon: github
        href: https://github.com/d-morrison/macros

format:
  html:
    theme:
      light: [cosmo, offwhite.scss]
      dark: darkly
    # Replaces Quarto's two-way toggle with a Light / Off-white / Parchment / Dark dropdown.
    include-in-header: theme-picker.html
    include-after-body:
      - anchor-landing.html
    css: styles.css
    toc: true

execute:
  warning: false
  message: false
  freeze: auto
